volumes:
  pgdata:
  zookeeper:
  clickhouse:
  state:

x-mixins:
  clickhouse-image: &clickhouse-image
    image: clickhouse/clickhouse-server:24.5.1.1763

services:
  clickhouse-server:
    <<: *clickhouse-image
    user: root
    hostname: clickhouse-server
    restart: on-failure
    volumes:
      - "./clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro"
      - "./clickhouse/conf.d:/etc/clickhouse-server/conf.d:ro"
      - "clickhouse:/clickhouse/"
    healthcheck:
      test: ["CMD", "bash", "-c", "clickhouse-client --query \"SELECT value FROM system.settings WHERE name = 'readonly'\" | grep -q '0'"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ulimit:
    #   nofile:
    #     soft: 262144
    #     hard: 262144

  clickhouse-init:
    <<: *clickhouse-image
    entrypoint: [ './migrations.sh' ]
    depends_on:
      clickhouse-server:
        condition: service_healthy
    volumes:
      - "./clickhouse/migrations.sh:/migrations.sh:ro"
      - "../migrations/stats:/migrations:ro"
      - "../migrations/stats-gen:/migrations-gen:ro"
      - "state:/state"
    environment:
      - REPLICATED=true

  database:
    image: postgres:16
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .db.env

  redis:
    image: redis
    restart: always

  nats:
    image: nats
    restart: always
    expose: [ "4222" ]
